apiVersion: apps/v1
kind: Deployment

metadata:
  name: user-service
  namespace: {{ .Values.namespace }}

spec:
  replicas: {{ .Values.user.replicas }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service

    spec:
      containers:
        - name: user-service
          image: "{{ .Values.user.image.repository }}:{{ .Values.user.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          envFrom:
            - configMapRef:
                name: user-service-config
            - configMapRef:
                name: database-config
            - secretRef:
                name: database-secret
          ports:
          - containerPort: 5001
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
